name = "feedback-relay"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Delivery records and rate-limit counters.
# Create with:  wrangler kv namespace create FEEDBACK_STORE
# then paste the returned id below. The id below is the namespace that the
# first relay deployment used. Check it before the next deploy.
[[kv_namespaces]]
binding = "FEEDBACK_STORE"
id = "3fa82a60e52a4a019bbf7863592f90d2"

# Secrets are provisioned out-of-band via `wrangler secret put`:
#   PRODUCT_<UPPER_ID>  — JSON per product:
#     { "github_repo": "owner/name",
#       "github_token": "...",
#       "image_api_key": "optional",
#       "testers": [ { "name": "zarko", "token_sha256": "<64 hex>" } ] }
# See docs/OPERATOR_RUNBOOK.md.
