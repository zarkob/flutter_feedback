name: feedback_relay
publish_to: none
description: >
  Shared feedback tool for Avensora test builds. Quick reports with a preview
  step, saved drafts, safe retries, honest delivery states, and one build
  control for test inclusion and production exclusion. The relay server holds
  every destination secret.
version: 0.3.0
homepage: https://github.com/zarkob/flutter_feedback
repository: https://github.com/zarkob/flutter_feedback
issue_tracker: https://github.com/zarkob/flutter_feedback/issues

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  feedback:
    path: ../feedback
  http: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
